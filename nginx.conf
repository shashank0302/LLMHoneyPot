# EC2 deployment: sudo nginx -c /path/to/honeypot/nginx.conf
# Replace /path/to/honeypot below with this repo's absolute path.

stream {
    log_format basic '$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time';

    access_log /path/to/honeypot/logs/nginx_access.log basic;

    upstream honeypot {
        server 127.0.0.1:2222;
    }

    server {
        listen 22;
        proxy_pass honeypot;
        proxy_timeout 600s;
        proxy_connect_timeout 10s;
    }
}
